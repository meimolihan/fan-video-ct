<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频剪切工具</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/favicon.svg" alt="" width="26" height="26">
      <span>视频剪切工具</span>
    </div>
    <div class="topbar-right">
      <button id="btn-theme" class="btn btn-sm" title="切换明暗主题" aria-label="切换明暗主题">🌙</button>
      <span id="version-badge" class="badge">v0.1.0</span>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧：文件浏览器 -->
    <aside class="panel filepanel">
      <div class="panel-head">
        <span class="panel-title">文件</span>
        <button id="btn-refresh" class="btn btn-sm" title="刷新">刷新</button>
      </div>
      <div id="file-list" class="file-list"></div>
    </aside>

    <!-- 中间：预览与剪切 -->
    <section class="panel workpanel">
      <div class="video-wrap">
        <video id="player" playsinline preload="metadata"></video>
        <div id="video-empty" class="video-empty">从左侧选择一个视频开始剪切</div>
        <div class="player-bar hidden" id="player-bar">
          <button id="btn-play" class="pbtn" title="播放 / 暂停">▶</button>
          <button id="btn-play-start" class="pbtn pbtn-label" title="从起点锚点播放到终点自动停止">▶ 起点</button>
          <button id="btn-play-end" class="pbtn pbtn-label" title="从终点锚点前 10 秒播放到终点自动停止">▶ 末尾10s</button>
          <div class="pbar" id="pbar">
            <div class="pbar-fill" id="pbar-fill"></div>
            <div class="pbar-seg" id="pbar-seg"></div>
            <div class="pbar-hit" id="pbar-hit"></div>
            <div class="phandle phandle-start" id="pbar-start"></div>
            <div class="phandle phandle-end" id="pbar-end"></div>
          </div>
          <span class="ptime" id="ptime">00:00:00 / 00:00:00</span>
          <button id="btn-stop" class="pbtn pbtn-stop" title="停止并关闭预览">⏹</button>
          <button id="btn-fs" class="pbtn" title="全屏">⛶</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="mode-group">
          <label class="radio">
            <input type="radio" name="mode" value="copy">
            <span>快速剪切（不重编码）</span>
          </label>
          <label class="radio">
            <input type="radio" name="mode" value="reencode" checked>
            <span>精确转码（重编码）</span>
          </label>
        </div>
        <div class="output-group">
          <input id="output-name" type="text" placeholder="输出文件名（可选）" class="input">
        </div>
        <button id="btn-cut" class="btn btn-primary">开始剪切</button>
      </div>

      <div class="adjustbar">
        <div class="adj-item">
          <span class="adj-label">起点</span>
          <button class="adj-btn" data-adj="start" data-dir="-1" title="向前微调起点">−</button>
          <button class="adj-btn" data-adj="start" data-dir="1" title="向后微调起点">＋</button>
          <button class="btn btn-sm btn-soft" id="btn-set-start" title="把起点设为当前播放帧">当前帧</button>
        </div>
        <div class="adj-item">
          <span class="adj-label">终点</span>
          <button class="adj-btn" data-adj="end" data-dir="-1" title="向前微调终点">−</button>
          <button class="adj-btn" data-adj="end" data-dir="1" title="向后微调终点">＋</button>
          <button class="btn btn-sm btn-soft" id="btn-set-end" title="把终点设为当前播放帧">当前帧</button>
        </div>
        <div class="adj-item">
          <span class="adj-label">步长</span>
          <select id="adj-step" class="input input-select" title="微调步长">
            <option value="0.1">0.1s</option>
            <option value="0.5" selected>0.5s</option>
            <option value="1">1s</option>
            <option value="5">5s</option>
            <option value="10">10s</option>
          </select>
        </div>
      </div>

      <div id="seg-box" class="segments"></div>

      <div class="presetbar" id="preset-bar">
        <button id="btn-presets" class="btn btn-soft" title="片头片尾预设：一键回填起止时间">片头片尾预设</button>
      </div>

      <div class="timeline-wrap">
        <div id="timeline" class="timeline">
          <div class="timeline-ticks" id="timeline-ticks"></div>
          <div class="timeline-progress" id="timeline-progress"></div>
          <div class="thumb thumb-start" id="thumb-start"></div>
          <div class="thumb thumb-end" id="thumb-end"></div>
          <div class="timeline-hit" id="timeline-hit"></div>
        </div>
        <div class="timeline-meta">
          <span id="time-start">00:00:00</span>
          <span id="time-dur">时长 --</span>
          <span id="time-end">00:00:00</span>
        </div>
        <div class="hotkeys">快捷键：<b>空格</b> 播放 / 暂停 · <b>←</b><b>→</b> 微调进度 · <b>[</b> 当前帧设为起点 · <b>]</b> 当前帧设为终点</div>
      </div>

      <div class="coverbar">
        <img id="cover-img" alt="封面">
        <div class="cover-actions">
          <label class="btn btn-sm">当前帧设为封面
            <input type="file" id="cover-file" accept="image/*" hidden>
          </label>
          <button id="btn-cover-current" class="btn btn-sm">截当前帧为封面</button>
          <button id="btn-cover-delete" class="btn btn-sm btn-danger">移除封面</button>
        </div>
      </div>
    </section>

    <!-- 右侧：任务列表 -->
    <aside class="panel taskpanel">
      <div class="panel-head">
        <span class="panel-title">任务</span>
        <button id="btn-clean" class="btn btn-sm" title="清除已完成任务">清空</button>
      </div>
      <div id="task-list" class="task-list"></div>
    </aside>
  </main>

  <div id="toast" class="toast"></div>

  <!-- ===== 片头片尾预设弹窗（纯增 / 追加，不改既有结构） ===== -->
  <div id="preset-modal" class="preset-modal" hidden aria-hidden="true">
    <div class="preset-dialog" role="dialog" aria-modal="true" aria-labelledby="preset-title">
      <div class="preset-head">
        <span id="preset-title" class="preset-title">片头片尾预设</span>
        <button id="preset-close" class="btn btn-sm btn-icon" title="关闭" aria-label="关闭">✕</button>
      </div>
      <div class="preset-hint">选择一条预设后自动计算：起点 = 片头时长，终点 = 视频总时长 − 片尾时长</div>
      <div class="preset-list" id="preset-list"></div>
      <div class="preset-foot">
        <button id="preset-add" class="btn btn-primary btn-block">＋ 新增预设</button>
      </div>
    </div>
  </div>

  <!-- 预设编辑 / 新增表单弹窗 -->
  <div id="preset-form-modal" class="preset-modal" hidden aria-hidden="true">
    <div class="preset-dialog preset-dialog-sm" role="dialog" aria-modal="true">
      <div class="preset-head">
        <span id="preset-form-title" class="preset-title">新增预设</span>
        <button id="preset-form-close" class="btn btn-sm btn-icon" title="关闭" aria-label="关闭">✕</button>
      </div>
      <div class="preset-form">
        <label class="preset-field">
          <span class="preset-field-label">预设名称</span>
          <input id="preset-name" type="text" class="input" placeholder="例如：电影 / 综艺" maxlength="40">
        </label>
        <label class="preset-field">
          <span class="preset-field-label">片头跳过时长（秒）</span>
          <input id="preset-head" type="number" class="input" min="0" step="1" value="0">
        </label>
        <label class="preset-field">
          <span class="preset-field-label">片尾跳过时长（秒）</span>
          <input id="preset-tail" type="number" class="input" min="0" step="1" value="0">
        </label>
        <div class="preset-form-actions">
          <button id="preset-form-save" class="btn btn-primary">保存</button>
          <button id="preset-form-cancel" class="btn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
